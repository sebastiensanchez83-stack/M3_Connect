[build]
  publish = "dist"
  command = "npm run build"

# Staging context — deploys from 'staging' branch with staging env vars
[context.staging]
  command = "npm run build"
  publish = "dist"

# Branch deploys enabled for staging
[context.branch-deploy]
  command = "npm run build"

# SM26 event module: enable its public /sm26/* routes on every NON-production
# context (PR deploy previews, branch deploys, staging) so it can be tested.
#
# Production is ALREADY LIVE — VITE_SM26_ENABLED=true is set on the production
# context in the Netlify UI, which this file cannot show. Verified 18 Aug 2026:
# /sm26/register and /sm26/jury/architecture both render on smartmarinaconnect.com.
# Do not read the absence of a production block below as "the module is hidden".
[context.deploy-preview.environment]
  VITE_SM26_ENABLED = "true"

[context.branch-deploy.environment]
  VITE_SM26_ENABLED = "true"

[context.staging.environment]
  VITE_SM26_ENABLED = "true"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── SEO: page heads and the sitemap, written at the edge ───────────────
# netlify/edge-functions/seo.ts writes each public page's own title,
# description, canonical URL and share card into the HTML: share robots
# (LinkedIn, WhatsApp, Slack…) never run JavaScript. sitemap.ts builds
# /sitemap.xml from the database. Both read Supabase with the public anon key
# from the environment (SUPABASE_URL + SUPABASE_ANON_KEY, or the VITE_ pair):
# in the Netlify UI its scopes must include "Functions". Without it both still
# answer, without the database part. The fixed copy of public/sitemap.xml is
# gone: this function is the only source.
[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml"
  cache = "manual"

# The seo function is declared inline, in netlify/edge-functions/seo.ts
# (`export const config`): an explicit list of the public pages it describes,
# GET only, and onError = "bypass" so a failing function serves the normal
# page, never an error page. onError cannot be set in this file. Do not
# declare it here too.

# ── Search engines: previews are never indexed ────────────────────────
# This file cannot depend on the host or the deploy context, so a rule here
# would also hit the production site. Two mechanisms, both outside it:
#  - netlify/edge-functions/seo.ts: on any host that is not smartmarinaconnect.com
#    (deploy previews, branch deploys such as refonte--m3connectv2.netlify.app,
#    *.netlify.app) every page it serves carries X-Robots-Tag: noindex, nofollow
#    and a robots noindex tag, and the browser-side <Seo> says noindex too;
#  - scripts/preview-noindex.mjs, the "postbuild" hook of `npm run build`: when
#    Netlify's CONTEXT is not "production", it appends a catch-all
#    X-Robots-Tag rule to dist/_headers, which covers every other path.
# Both do nothing on production. Do not add a Disallow to robots.txt for this:
# a robot that may not fetch a page never reads its noindex.

# ── Search engines: private, personal and token pages ─────────────────
# X-Robots-Tag works without JavaScript, for every robot. These paths must not
# be Disallowed in robots.txt: a robot that may not fetch a page never sees
# its noindex. Never remove one of these routes because of this list: printed
# and e-mailed links (QR codes, /wys26/guest?t=, /sm26/jury/…) must keep working.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

